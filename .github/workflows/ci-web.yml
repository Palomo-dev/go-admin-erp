name: CI Web

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'print-agent/**'
      - '.eslintrc.json'
      - 'jest.config.js'
      - 'jest.setup.tz.ts'
      - 'package.json'
      - 'tsconfig.json'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'print-agent/**'
      - '.eslintrc.json'
      - 'jest.config.js'
      - 'jest.setup.tz.ts'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
        # Las reglas de fecha estan en 'warn' para lo no migrado.
        # Cuando P1-3 termine, quitar continue-on-error para que rompa el build.

  typecheck:
    name: TypeScript (tsc --noEmit)
    # Compuerta de tipos del repo. Vercel y el build del desktop no la hacen
    # dentro de `next build` (NEXT_SKIP_TYPECHECK=1): necesita ~8 GB de heap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # `electron/src/**` entra en el tsconfig raíz (y los tests de permisos lo
      # importan): sin las dependencias de electron/ salen 99 «Cannot find module 'electron'».
      - run: npm ci --prefix electron
      - run: npx tsc --noEmit -p tsconfig.json
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  timezone-tests:
    name: Timezone tests (TZ=UTC + TZ=America/Bogota)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: ['UTC', 'America/Bogota']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx jest src/__tests__/timezone/ src/__tests__/guardrails.test.ts
        env:
          TZ: ${{ matrix.tz }}

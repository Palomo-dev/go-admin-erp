name: Mobile Build (Capacitor)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (android, ios, both)'
        required: false
        default: 'both'
        type: choice
        options:
          - android
          - ios
          - both

env:
  NODE_VERSION: '22'
  CAPACITOR_APP_ID: io.goadmin.app

jobs:
  # ============================================================================
  # Job 1: Sincronizar Capacitor + verificar tipos
  # ============================================================================
  validate:
    name: Validate (sync + typecheck)
    runs-on: ubuntu-latest
    outputs:
      should_build_android: ${{ steps.decide.outputs.android }}
      should_build_ios: ${{ steps.decide.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile project
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Ensure Android assets directory exists
        working-directory: mobile
        run: mkdir -p android/app/src/main/assets/public

      - name: Capacitor sync (Android only)
        working-directory: mobile
        run: npx cap sync android

      - name: Decide platforms
        id: decide
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'android' }}"
          if [ "$PLATFORM" = "android" ] || [ "$PLATFORM" = "both" ]; then
            echo "android=true" >> $GITHUB_OUTPUT
          else
            echo "android=false" >> $GITHUB_OUTPUT
          fi
          # iOS deshabilitado: el proyecto Xcode no está commiteado (falta
          # App.xcodeproj, Podfile, etc.). Reactivar cuando se haga cap add ios
          # y se commitee el proyecto nativo completo.
          echo "ios=false" >> $GITHUB_OUTPUT

  # ============================================================================
  # Job 2: Build Android (.aab)
  # ============================================================================
  build-android:
    name: Build Android (.aab)
    needs: validate
    if: needs.validate.outputs.should_build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Ensure Android assets directory exists
        working-directory: mobile
        run: mkdir -p android/app/src/main/assets/public

      - name: Capacitor sync Android
        working-directory: mobile
        run: npx cap sync android

      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release.keystore

      - name: Build Android .aab (release)
        working-directory: mobile/android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=app/release.keystore \
              -Pandroid.injected.signing.store.password=$ANDROID_STORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=goadmin \
              -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD
          else
            echo "No keystore found — building unsigned .aab"
            ./gradlew bundleRelease
          fi

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # ============================================================================
  # Job 3: Build iOS (.ipa) — requiere macOS runner
  # ============================================================================
  build-ios:
    name: Build iOS (.ipa)
    needs: validate
    if: needs.validate.outputs.should_build_ios == 'true'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Ensure iOS App directory exists
        working-directory: mobile
        run: mkdir -p ios/App/App/public

      - name: Capacitor sync iOS
        working-directory: mobile
        run: npx cap sync ios

      - name: Decode iOS certificate
        if: env.IOS_CERTIFICATE_P12_BASE64 != ''
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Decode provisioning profile
        if: env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/goadmin.mobileprovision

      - name: Build iOS .ipa (xcodebuild)
        working-directory: mobile/ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # Inyectar Team ID en exportOptions.plist
          sed -i '' "s/\${IOS_TEAM_ID}/$IOS_TEAM_ID/g" exportOptions.plist 2>/dev/null || \
          sed -i "s/\${IOS_TEAM_ID}/$IOS_TEAM_ID/g" exportOptions.plist

          if [ -f ~/Library/MobileDevice/Provisioning\ Profiles/goadmin.mobileprovision ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              -destination generic/platform=iOS \
              archive

            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist exportOptions.plist \
              -exportPath build/output
          else
            echo "No provisioning profile found — skipping signed build"
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination generic/platform=iOS \
              -sdk iphoneos \
              build
          fi

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            mobile/ios/App/build/output/*.ipa
            mobile/ios/App/build/*.xcarchive
          retention-days: 30
